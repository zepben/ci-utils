apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argo-cd
  labels:
    type: system
spec:
  project: default
  sources:
    - repoURL: file:///mnt/local-repos/ci-utils
      targetRevision: HEAD
      path: argo-cd/bootstrap

    - repoURL: file:///mnt/local-repos/ci-utils
      targetRevision: HEAD
      path: argo-cd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true