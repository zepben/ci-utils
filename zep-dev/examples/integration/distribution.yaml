# Pins from oci://ghcr.io/zepben/charts at authoring time.
# Helm versions use '+'. OCI tags use '_'. Helm changes '_' to '+' on pull.
#
# Refresh a pin:
#   skopeo list-tags docker://ghcr.io/zepben/charts/<name> \
#     --authfile "$HOME/.config/containers/auth.json"
