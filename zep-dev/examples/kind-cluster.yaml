kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # This is for ArgoCD
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
    extraMounts:
      # This is to make local repos available to ArgoCD
      - hostPath: /home/roberto/Desktop/EVOLVE/repos
        containerPath: /mnt/local-repos
        readOnly: true

    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "v1.kubernetes.zepben.com/node-class=high-memory"
