helm_repos:
  argo: "https://argoproj.github.io/argo-helm"
cluster_components:
  - name: argo-cd
    chart: argo/argo-cd
    version: "9.5.0"
    namespace: argo-cd
    values:
      applicationSet:
        replicas: 1
      configs:
        cm:
          admin.enabled: true
        params:
          server.insecure: true
      controller:
        replicas: 1
      dex:
        enabled: false
      global:
        affinity:
          nodeAffinity:
            type: none
          podAntiAffinity: none
        networkPolicy:
          create: false
      notifications:
        enabled: false
      redis-ha:
        enabled: false
      repoServer:
        autoscaling:
          enabled: false
        replicas: 1
      server:
        autoscaling:
          enabled: false
        ingress:
          enabled: false
        replicas: 1
        # Expose to the host so we can browse without port-forwarding, see kind-cluster.yaml
        service:
          nodePortHttp: 30080
          type: NodePort
