helm_repos:
  argo: "https://argoproj.github.io/argo-helm"
cluster_components:
  - name: argo-cd
    chart: argo/argo-cd
    version: "9.5.0"
    namespace: argo-cd
    # Signals to zep-dev to apply the extra ArgoCD values overlay
    # that ensures we always schedule on a worker with the correct
    # mounts, and that the expected env variables exist, etc.
    local_repo_integration:
      type: argo-cd
    # Create a ConfigMap from a file relative to this components file.
    config_maps_from_file:
      - name: kind-cluster-config
        from_file:
          kind-cluster.yaml: kind-cluster.yaml
    # Complete values to be passed to helm.
    values:
      applicationSet:
        replicas: 1
      configs:
        cm:
          admin.enabled: true
        params:
          server.insecure: true
      controller:
        replicas: 1
      dex:
        enabled: false
      global:
        affinity:
          nodeAffinity:
            type: none
          podAntiAffinity: none
        networkPolicy:
          create: false
      notifications:
        enabled: false
      redis-ha:
        enabled: false
      repoServer:
        autoscaling:
          enabled: false
        replicas: 1
      server:
        autoscaling:
          enabled: false
        ingress:
          enabled: false
        replicas: 1
        # Expose to the host so we can browse without port-forwarding, see kind-cluster.yaml
        service:
          nodePortHttp: 30080
          type: NodePort
