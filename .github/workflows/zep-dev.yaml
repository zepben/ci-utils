name: zep-dev

on:
  pull_request:
    paths:
      - "zep-dev/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      # zep-dev mounts the resulting ~/.docker/config.json into the kind nodes,
      # so redis is pulled authenticated instead of from the shared runner IP.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Lint and test zep-dev
        run: |
          make check-zep-dev
          make test-zep-dev
          make setup-k8s
          make teardown-k8s
