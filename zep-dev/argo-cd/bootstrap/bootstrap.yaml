apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  labels:
    type: system
spec:
  project: default
  source:
    repoURL: file:///mnt/local-repos/ci-utils
    targetRevision: HEAD
    path: zep-dev/argo-cd/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true